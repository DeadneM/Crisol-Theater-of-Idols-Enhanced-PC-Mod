; CRToi Enhanced V0.9C native shop / player-camera cinematic FOV test
; This INI is a reference example in GitHub, NOT shipped in the 2-file ZIP.
; Existing settings files are preserved automatically between versions.
[Hotkeys]
MenuVirtualKey=45
CheatShopVirtualKey=112
FreecamVirtualKey=113
TeleportVirtualKey=114
SMLConsoleVirtualKey=0
DeveloperConsoleScanCode=41

[Camera]
; Enable automatic camera capture after gameplay starts. Manual recapture remains.
AutoCaptureGameplay=1
KeepFOVInPlayerCinematics=1
WorldFOVEnabled=0
WorldFOV=90
FPSFOVEnabled=0
FPSFOV=85

[Startup]
; Do not rename/remove videos. Intercept ONLY reads for three startup MP4 files.
; Default is on. Change in the menu, then restart to retest startup.
SkipIntroVideos=1

[Freecam]
Speed=600
