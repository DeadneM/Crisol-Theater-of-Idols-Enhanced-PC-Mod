; CRToi Enhanced V0.5A F1 CHEATSHOP TEST (Windows x64)
; The proven V0.4A scoped camera/FOV behavior remains unchanged.
[Hotkeys]
MenuVirtualKey=45
; 112 decimal = F1. Rebind via the in-game ImGui CheatShop section.
CheatShopVirtualKey=112
; Optional: match a custom SML console-open key as a Win32 VK.
; 0 = automatic -consolekey=F1..F12 detection, otherwise physical
; tilde/² key (scancode 41) below Escape. Example F10 = 121.
SMLConsoleVirtualKey=0
DeveloperConsoleScanCode=41

[Camera]
; Override only after 'Capture gameplay camera' during normal gameplay.
WorldFOVEnabled=0
WorldFOV=90
FPSFOVEnabled=0
FPSFOV=85
