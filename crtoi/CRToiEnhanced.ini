; Crisol Enhanced PC Mod V0.7A FREECAM + TELEPORT TEST (Windows x64)
; Preserve your current CRToiEnhanced.ini if you customized FOV values.
[Hotkeys]
MenuVirtualKey=45
CheatShopVirtualKey=112
; 113 = F2: freecam on/off. 114 = F3: teleport character to freecam.
FreecamVirtualKey=113
TeleportVirtualKey=114
SMLConsoleVirtualKey=0
DeveloperConsoleScanCode=41

[Camera]
; Both FOV overrides remain independent and require gameplay camera capture.
WorldFOVEnabled=0
WorldFOV=90
FPSFOVEnabled=0
FPSFOV=85

[Freecam]
; Flight speed in Unreal cm/second. Hold Shift to multiply by 3.
Speed=600
; Freecam never autostarts. Flight does not save player coordinates.
