name: Crisol Windows x64 builds
on:
  push:
    branches: [main, "dev/v0.5-cheatshop", "dev/v0.6-native-cheatshop", "dev/v0.7-freecam-teleport", "dev/v0.8-autocamera-skip-intro", "dev/v0.8b-cheatshop-input", "dev/v0.9c-native-console-camera"]
    paths:
      - "crtoi/**"
      - "src/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: crisol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake -S crtoi -B crtoi/build -G "Visual Studio 18 2026" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed" }
      - name: Build
        shell: pwsh
        run: |
          cmake --build crtoi/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Verify unsupported executables cannot call game functions
        shell: pwsh
        run: |
          ctest --test-dir crtoi/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native-call guard test failed" }
      - name: Package, hash and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = switch ($env:GITHUB_REF_NAME) {
            "main" { "CRToi_Enhanced_V0.4A_VALIDATED_FOV_x64.zip" }
            "dev/v0.5-cheatshop" { "CRToi_Enhanced_V0.5A_CHEATSHOP_TEST_x64.zip" }
            "dev/v0.6-native-cheatshop" { "CRToi_Enhanced_V0.6A_NATIVE_CHEATSHOP_AUDIT_x64.zip" }
            "dev/v0.7-freecam-teleport" { "CRToi_Enhanced_V0.7A_FREECAM_TELEPORT_TEST_x64.zip" }
            "dev/v0.8-autocamera-skip-intro" { "CRToi_Enhanced_V0.8A_AUTOFOV_SKIP_INTRO_TEST_x64.zip" }
            "dev/v0.8b-cheatshop-input" { "CRToi_Enhanced_V0.8B_CHEATSHOP_INPUT_TEST_x64.zip" }
            "dev/v0.9c-native-console-camera" { "CRToi_Enhanced_V0.9G_NATIVE_SHOP_CAMERA_TEST_x64.zip" }
            default { throw "Unknown branch: $env:GITHUB_REF_NAME" }
          }
          if (Test-Path crtoi/package) { Remove-Item crtoi/package -Recurse -Force }
          New-Item -ItemType Directory -Force crtoi/package | Out-Null
          Copy-Item crtoi/build/Release/dxgi.dll crtoi/package/dxgi.dll
          Copy-Item crtoi/build/Release/CRToiEnhanced.asi crtoi/package/CRToiEnhanced.asi
          $files = @(Get-ChildItem crtoi/package -File | Sort-Object Name)
          if ($files.Count -ne 2 -or ($files.Name -notcontains 'dxgi.dll') -or
              ($files.Name -notcontains 'CRToiEnhanced.asi')) {
            throw "Only dxgi.dll and CRToiEnhanced.asi are permitted in the install ZIP"
          }
          Compress-Archive -Path crtoi/package/* -DestinationPath "crtoi/$name" -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash "crtoi/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP_NAME=crtoi/$name" | Out-File $env:GITHUB_ENV -Append
          "## Crisol Windows x64 build" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Commit: $env:GITHUB_SHA; branch: $env:GITHUB_REF_NAME; run: $env:GITHUB_RUN_ID" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "ZIP SHA-256: $zipHash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($file.Name) SHA-256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Sign build provenance for the ZIP
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ZIP_NAME }}
      - name: Upload build output (requires review before release)
        uses: actions/upload-artifact@v4
        with:
          name: Crisol-${{ github.ref_name == 'dev/v0.9c-native-console-camera' && 'V0.9G-Native-Shop-Camera' || github.ref_name == 'dev/v0.8b-cheatshop-input' && 'V0.8B-CheatShop-Input' || 'V0.8A-AutoFOV-SkipIntro' }}-TEST-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 90
          if-no-files-found: error
